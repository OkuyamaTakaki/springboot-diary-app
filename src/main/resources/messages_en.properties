footer.privacy=Privacy information
privacy.pageTitle=Privacy information - Gratitude Diary
privacy.heading=Privacy information
privacy.summary=This page explains what Gratitude Diary handles, why it is needed, where it is stored, and how it is protected.
privacy.status.title=Pre-release setup is required
privacy.status.message=The operator contact is not configured. Before publishing this service with personal data, set APP_PRIVACY_CONTACT_URL and finalize the retention and operating procedures.
privacy.data.heading=Information handled
privacy.data.body=The service stores a username, a BCrypt password hash, diary titles and entries, creation and update times, and internal identifiers. It handles authentication and language cookies plus the minimum access logs needed for secure operation and incident investigation. Plain-text passwords are not stored.
privacy.purpose.heading=Purposes
privacy.purpose.body=Information is used only to authenticate users, store and display each user diary, edit entries, remember the display language, prevent misuse, investigate failures, and maintain service quality.
privacy.storage.heading=Storage and service providers
privacy.storage.body=The application runs on Render and uses Neon PostgreSQL for its database. These providers process information as needed to deliver the service. Before release, the operator must verify the actual plans, storage regions, current terms, and privacy conditions for both providers.
privacy.cookies.heading=Cookies
privacy.cookies.body=JSESSIONID keeps the user signed in, and diary-language remembers the selected language for one year. No advertising tracking cookie is used. JSESSIONID becomes invalid after logout or session expiry.
privacy.sharing.heading=Sharing, advertising, and analytics
privacy.sharing.body=There is no feature that publishes diary entries to other users, and the service has no advertising or behavioral analytics. Information is not sold. Except when required by law, it is shared only with hosting and database providers as needed to operate the service.
privacy.retention.heading=Retention and deletion
privacy.retention.body=Account and diary information is kept while the account or service needs it. The current interface has no delete function. Before release, the operator must define request handling and specific retention for deletion requests, backups, and access logs together with the contact method.
privacy.rights.heading=Access and correction requests
privacy.rights.body=Requests to access, correct, stop use of, or delete registered information are accepted through the contact below. The operator will verify identity and scope, then respond under applicable law and operating constraints. Signed-in users can edit diary titles and entries.
privacy.security.heading=Security measures
privacy.security.body=The service uses BCrypt password hashing, per-user ownership checks, CSRF protection, Content Security Policy, environment-based secret settings, and secure production cookies. No Internet storage is absolutely secure, so dependencies and access activity must continue to be reviewed after release.
privacy.contact.heading=Contact
privacy.contact.link=Open the temporary contact route (GitHub profile)
privacy.contact.notice=A dedicated contact route is still being prepared. This temporary route is a public profile, not a private form. Do not send passwords, diary content, names, or other confidential or personal information.
privacy.contact.missing=The contact is waiting for pre-release configuration. Do not post confidential information or diary contents in a public GitHub Issue.

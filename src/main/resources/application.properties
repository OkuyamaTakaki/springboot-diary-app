spring.application.name=myapp
server.port=${PORT:8080}

# Render では DATABASE_URL が設定される想定。未設定時のみローカルの H2 を使う。
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/diary}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Tokyo

# Render の公開 Web 環境では H2 コンソールを無効化し、DB へ外部公開しないようにする
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

logging.level.org.springframework.security=DEBUG

h2.admin.password=${H2_ADMIN_PASSWORD:admin}

spring.application.name=myapp
server.port=${PORT:8080}

# Render では DATABASE_URL が設定される想定。未設定時のみローカルの H2 を使う。
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/diary}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Tokyo

# OSの既定言語ではなく、利用者が選んだ言語だけでメッセージを解決する。
# 日本語指定が英語OS上でmessages_en.propertiesへ変わる環境依存を防ぐ。
spring.messages.fallback-to-system-locale=false

# H2 コンソールは依存関係ごと除外し、DB管理機能をWebへ公開しない。
spring.h2.console.enabled=false

logging.level.org.springframework.security=INFO

# 仮窓口は公開済みプロフィールだけを案内し、個人のメールアドレスを固定しない。
# 正式窓口が決まったらAPP_PRIVACY_CONTACT_URLで上書きする。
app.privacy.contact-url=${APP_PRIVACY_CONTACT_URL:https://github.com/OkuyamaTakaki}

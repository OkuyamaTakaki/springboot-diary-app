footer.privacy=プライバシー情報
privacy.pageTitle=プライバシー情報 - 奥山貴希のありがとう日記
privacy.heading=プライバシー情報
privacy.summary=この画面は、奥山貴希のありがとう日記が扱う情報、その目的、保存先と安全管理を利用者向けに説明します。
privacy.status.title=公開前の確認が必要です
privacy.status.message=運営者の問い合わせ先が未設定です。個人情報を扱う本番サービスとして公開する前に、APP_PRIVACY_CONTACT_URLを設定し、保存期間と運用手順を確定してください。
privacy.data.heading=扱う情報
privacy.data.body=ユーザー名、BCryptでハッシュ化したパスワード、日記のタイトルと本文、作成・更新日時、内部識別子を保存します。認証と表示言語のCookie、および安全な運用や障害調査に必要な最小限のアクセスログを扱います。平文のパスワードは保存しません。
privacy.purpose.heading=利用目的
privacy.purpose.body=本人確認、利用者ごとの日記の保存・表示・編集、表示言語の保持、不正利用の防止、障害調査とサービス品質の維持に限って利用します。
privacy.storage.heading=保存先と外部事業者
privacy.storage.body=アプリの実行にはRender、データベースにはNeon PostgreSQLを使用します。これらの事業者はサービス提供に必要な範囲で情報を処理します。公開前に、実際の契約プラン、保存地域、各社の最新規約とプライバシー条件を運営者が確認します。
privacy.cookies.heading=Cookie
privacy.cookies.body=ログイン状態を保つJSESSIONIDと、選択言語を1年間保つdiary-languageを使用します。広告追跡用Cookieは使用しません。JSESSIONIDはログアウトまたは有効期限で無効になります。
privacy.sharing.heading=第三者提供・広告・解析
privacy.sharing.body=日記を他の利用者へ公開する機能、広告、行動解析はありません。情報を販売しません。法令に基づく場合を除き、ホスティングとデータベースの提供に必要な外部事業者以外へ提供しません。
privacy.retention.heading=保存期間と削除
privacy.retention.body=アカウントと日記は、アカウントの利用またはサービス運用に必要な間保存します。現在の画面には削除機能がありません。削除依頼、バックアップ、アクセスログの具体的な保存期間と対応手順は、問い合わせ先と合わせて本番公開前に運営者が確定します。
privacy.rights.heading=確認・訂正などの依頼
privacy.rights.body=登録情報の確認、訂正、利用停止、削除に関する依頼は、下記の問い合わせ先で受け付けます。本人確認と影響範囲を確認したうえで、適用される法令と運用条件に沿って対応します。日記本文とタイトルはログイン後に本人が編集できます。
privacy.security.heading=安全管理
privacy.security.body=パスワードのBCryptハッシュ化、利用者ごとの所有者確認、CSRF対策、Content Security Policy、秘密設定の環境変数管理、本番HTTPS Cookieを使用します。ただし、インターネット上の保存に絶対的な安全はないため、公開後も依存関係とアクセス状況を継続確認します。
privacy.contact.heading=お問い合わせ
privacy.contact.link=仮問い合わせ窓口（GitHubプロフィール）を開く
privacy.contact.notice=正式な専用窓口を準備中です。仮窓口は公開プロフィールの案内であり、非公開フォームではありません。パスワード、日記本文、氏名などの秘密情報・個人情報は送らないでください。
privacy.contact.missing=問い合わせ先は公開前の設定待ちです。機密情報や日記内容を公開のGitHub Issueへ投稿しないでください。
privacy.updateDate=更新日: 2026年9月3日

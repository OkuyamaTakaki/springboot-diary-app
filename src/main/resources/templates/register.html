<!DOCTYPE html>
<html lang="ja" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title th:text="#{register.pageTitle}">新規登録 - ありがとう日記</title>
  <link rel="stylesheet" th:href="@{/css/diary.css(v=20260901-4)}">
</head>
<body class="register-page">
  <main class="container register-container">
    <div th:replace="~{fragments/language :: switcher}"></div>
    <div class="app-title">
      <div class="app-title-main" th:text="#{app.name}">ありがとう日記</div>
      <div class="app-title-sub" th:text="#{app.tagline}">感謝を記録する日記アプリ</div>
    </div>
    <aside class="startup-notice" aria-labelledby="startupNoticeTitle">
      <strong id="startupNoticeTitle" th:text="#{startup.notice.title}">
        初回表示に時間がかかる場合があります
      </strong>
      <span th:text="#{startup.notice.message}">
        無料環境の休止後は、起動まで少し時間がかかる場合があります。
      </span>
    </aside>
    <h1 th:text="#{register.heading}">新規登録</h1>
    <form th:action="@{/register}" method="post">
      <!-- CSRFトークンを同送し、外部サイトからの不正登録を防止する。 -->
      <input type="hidden"
             th:name="${_csrf.parameterName}"
             th:value="${_csrf.token}">
      <div class="form-group">
        <label for="username" th:text="#{common.username}">ユーザー名</label>
        <input type="text"
               id="username"
               name="username"
               th:value="${username}"
               minlength="3"
               maxlength="50"
               pattern="[\p{L}\p{N}._-]{3,50}"
               aria-describedby="usernameHint"
               required
               autocomplete="username">
        <p id="usernameHint" class="form-hint" th:text="#{register.usernameHint}">
          3〜50文字。文字・数字・「.」「-」「_」が使えます。
        </p>
      </div>
      <div class="form-group">
        <label for="password" th:text="#{common.password}">パスワード</label>
        <input type="password"
               id="password"
               name="password"
               minlength="8"
               maxlength="72"
               aria-describedby="passwordHint"
               required
               autocomplete="new-password">
        <p id="passwordHint" class="form-hint" th:text="#{register.passwordHint}">
          8文字以上の推測されにくいパスワードを設定してください。
        </p>
      </div>
      <button type="submit" th:text="#{register.submit}">登録</button>
    </form>
    <div class="form-footer">
      <a th:href="@{/login}" class="link-secondary" th:text="#{common.backToLogin}">ログイン画面へ戻る</a>
    </div>
    <div th:replace="~{fragments/footer :: footer}"></div>
  </main>
  <div th:replace="~{fragments/notification :: notification}"></div>
  <!-- 登録結果を共通通知モーダルへ渡す。 -->
  <div id="registerSuccessMessage"
       th:if="${successMessage}"
       th:text="${successMessage}"
       hidden></div>
  <div id="registerErrorMessage"
       th:if="${registerErrorMessage}"
       th:text="${registerErrorMessage}"
       hidden></div>
  <script th:src="@{/js/diary.js(v=20260901-1)}"></script>
</body>
</html>

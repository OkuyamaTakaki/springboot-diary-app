<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新規登録 - ありがとう日記</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/diary.css(v=20260827-6)}">
</head>
<body class="register-page">
  <main class="container register-container">
    <div class="app-title">
      <div class="app-title-main">ありがとう日記</div>
      <div class="app-title-sub">感謝を記録する日記アプリ</div>
    </div>
    <h1>新規登録</h1>
    <form th:action="@{/register}" method="post">
      <!-- CSRFトークンを同送し、外部サイトからの不正登録を防止する。 -->
      <input type="hidden"
             th:name="${_csrf.parameterName}"
             th:value="${_csrf.token}">
      <div class="form-group">
        <label for="username">ユーザー名</label>
        <input type="text"
               id="username"
               name="username"
               th:value="${username}"
               minlength="3"
               maxlength="50"
               pattern="[\p{L}\p{N}._-]{3,50}"
               aria-describedby="usernameHint"
               required
               autocomplete="username">
        <p id="usernameHint" class="form-hint">
          3〜50文字。文字・数字・「.」「-」「_」が使えます。
        </p>
      </div>
      <div class="form-group">
        <label for="password">パスワード</label>
        <input type="password"
               id="password"
               name="password"
               minlength="8"
               maxlength="72"
               aria-describedby="passwordHint"
               required
               autocomplete="new-password">
        <p id="passwordHint" class="form-hint">
          8文字以上の推測されにくいパスワードを設定してください。
        </p>
      </div>
      <button type="submit">登録</button>
    </form>
    <div class="form-footer">
      <a th:href="@{/login}" class="link-secondary">ログイン画面へ戻る</a>
    </div>
  </main>
  <div th:replace="~{fragments/notification :: notification}"></div>
  <!-- 登録結果を共通通知モーダルへ渡す。 -->
  <div id="registerSuccessMessage"
       th:if="${successMessage}"
       th:text="${successMessage}"
       hidden></div>
  <div id="registerErrorMessage"
       th:if="${registerErrorMessage}"
       th:text="${registerErrorMessage}"
       hidden></div>
  <script th:src="@{/js/diary.js}"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新規登録 - ありがとう日記</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/diary.css}">
</head>

<body class="register-page">

    <main class="container register-container">

        <!-- アプリ名を表示します。 -->
        <div class="app-title">
            <div class="app-title-main">ありがとう日記</div>
            <div class="app-title-sub">感謝を記録する日記アプリ</div>
        </div>

        <h1>新規登録</h1>

        <!-- 新規ユーザー登録フォーム -->
        <form th:action="@{/register}" method="post">

            <!-- CSRF対策用トークン -->
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <div class="form-group">
                <label for="username">ユーザー名</label>
                <input type="text"
                       id="username"
                       name="username"
                       th:value="${username}"
                       required
                       autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">パスワード</label>
                <input type="password"
                       id="password"
                       name="password"
                       required
                       autocomplete="new-password">
            </div>

            <button type="submit">登録</button>
        </form>

        <!-- ログイン画面へのリンク -->
        <div class="form-footer">
            <a th:href="@{/login}" class="link-secondary">
                ログイン画面へ戻る
            </a>
        </div>
    </main>

    <!-- 共通通知モーダルを読み込みます。 -->
    <div th:replace="~{fragments/notification :: notification}"></div>

    <!-- 登録成功時のメッセージをJavaScriptへ渡します。 -->
    <div id="registerSuccessMessage"
         th:if="${successMessage}"
         th:text="${successMessage}"
         hidden>
    </div>

    <!-- ユーザー名重複などの登録エラーをJavaScriptへ渡します。 -->
    <div id="registerErrorMessage"
         th:if="${registerErrorMessage}"
         th:text="${registerErrorMessage}"
         hidden>
    </div>

    <!-- 共通JavaScript -->
    <script th:src="@{/js/diary.js}"></script>

</body>
</html>

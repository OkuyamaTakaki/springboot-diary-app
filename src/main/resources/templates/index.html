<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>日記アプリ</title>
</head>
    <body>
        <h1>日記アプリ</h1>
        <form th:action="@{/logout}" method="post">
            <input type="hidden"
                th:name="${_csrf.parameterName}"
                th:value="${_csrf.token}">
            <button type="submit">ログアウト</button>
        </form>
        <h2>日記を書く</h2>
        <form action="/diary" method="post">
            <input type="hidden"
                th:name="${_csrf.parameterName}"
                th:value="${_csrf.token}">
            <div>
                <label>
                    タイトル：
                    <input type="text" name="title">
                </label>
            </div>
            <br>
            <div>
                <label>
                    本文：
                    <br>
                    <textarea name="content" rows="10" cols="50"></textarea>
                </label>
            </div>
            <br>
            <button type="submit">登録</button>
        </form>
        <hr>
        <h1 th:text="${username} + 'さんの日記'"></h1>
        <h2>日記一覧</h2>
        <table border="1">
            <thead>
                <tr>
                    <th>日付</th>
                    <th>タイトル</th>
                    <th>本文</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="diary : ${diaries}">
                    <td th:text="${#temporals.format(diary.createdAt, 'yyyy年M月d日')}"></td>
                    <td th:text="${diary.title}"></td>
                    <td th:text="${diary.content}"></td>

                    <td>
                        <form th:action="@{/diary/delete/{id}(id=${diary.id})}" method="post">
                            <button type="submit">削除</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </body>
</html>

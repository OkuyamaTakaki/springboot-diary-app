<!DOCTYPE html>
<html lang="ja" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title th:text="#{diary.pageTitle}">マイページ - 奥山貴希のありがとう日記</title>
  <link rel="stylesheet" th:href="@{/css/diary.css(v=20260901-4)}">
</head>

<body>
  <!-- ログイン中のユーザー名とログアウト操作を表示します。 -->
  <header class="site-header">
    <h1 th:text="#{diary.userHeading(${username})}">
      ユーザー名さんの日記
    </h1>

    <div class="header-actions">
      <div th:replace="~{fragments/language :: switcher}"></div>
      <form th:action="@{/logout}" method="post" class="logout-form">
        <input
          type="hidden"
          th:name="${_csrf.parameterName}"
          th:value="${_csrf.token}"
        >
        <button type="submit" class="btn-text" th:text="#{diary.logout}">ログアウト</button>
      </form>
    </div>
  </header>

  <main class="container">
    <!-- 日記の新規登録セクション -->
    <section class="diary-write-section">
      <button
        type="button"
        id="diaryFormToggle"
        class="diary-form-toggle"
        aria-controls="diaryWriteForm"
        aria-expanded="false"
      >
        <span id="diaryFormToggleText" th:text="#{diary.write}">日記を書く</span>
        <span
          id="diaryFormToggleIcon"
          class="toggle-icon"
          aria-hidden="true"
        >
          ▼
        </span>
      </button>

      <div id="diaryWriteForm" class="diary-form-container">
        <form th:action="@{/diary}" method="post">
          <input
            type="hidden"
            th:name="${_csrf.parameterName}"
            th:value="${_csrf.token}"
          >

          <div class="form-group">
            <label for="title" th:text="#{diary.title}">タイトル</label>
            <input
              type="text"
              id="title"
              name="title"
              th:value="${title}"
              maxlength="100"
              required
            >
          </div>

          <div class="form-group">
            <label for="content" th:text="#{diary.content}">本文</label>
            <textarea
              id="content"
              name="content"
              rows="10"
              th:text="${content}"
              maxlength="2000"
              required
            ></textarea>
          </div>

          <div class="form-actions">
            <button type="submit" th:text="#{diary.create}">登録</button>
          </div>
        </form>
      </div>

      <!-- 登録エラーは通知モーダルから表示します。 -->
      <div
        th:if="${errorMessage}"
        id="diaryErrorMessage"
        th:text="${errorMessage}"
        hidden
      ></div>
    </section>

    <!-- 日記一覧セクション -->
    <section class="diary-list-section">
      <div class="diary-list-header">
        <h2 th:text="#{diary.list}">日記一覧</h2>

        <!-- 選択した並び順をGETリクエストでControllerへ送信します。 -->
        <form
          th:action="@{/(searchDate=${searchDate})}"
          method="get"
          class="sort-form"
        >
          <input
            type="hidden"
            name="searchDate"
            th:value="${searchDate}"
          >

          <label for="sort" class="sort-label" th:text="#{diary.sort}">並べ替え</label>

          <select
            id="sort"
            name="sort"
            class="sort-select"
            th:attr="aria-label=#{diary.sortAria}"
          >
            <option
              value="desc"
              th:selected="${sort == null or sort == 'desc'}"
              th:text="#{diary.newest}"
            >
              新しい順
            </option>

            <option
              value="asc"
              th:selected="${sort == 'asc'}"
              th:text="#{diary.oldest}"
            >
              古い順
            </option>
          </select>
        </form>
      </div>

      <div class="diary-search-bar">
        <form th:action="@{/}" method="get" class="search-form">
          <input type="hidden" name="sort" th:value="${sort}" />

          <label for="searchDate" class="search-label" th:text="#{diary.searchDate}">日付で検索</label>

          <div class="search-controls">
            <input
              type="date"
              id="searchDate"
              name="searchDate"
              class="search-input"
              th:value="${searchDate}"
              th:attr="aria-label=#{diary.searchDate}"
            >

            <button type="submit" class="btn-search" th:text="#{diary.search}">検索</button>

            <a
              th:if="${searchDate != null and !#strings.isEmpty(searchDate)}"
              th:href="@{/(sort=${sort})}"
              class="btn-reset"
              th:text="#{diary.clear}"
            >
              クリア
            </a>
          </div>
        </form>
      </div>

      <!-- 日記一覧テーブル -->
      <div class="table-responsive">
        <table class="diary-table">
          <thead>
            <tr>
              <th th:text="#{diary.createdDate}">作成日</th>
              <th th:text="#{diary.updatedDate}">更新日</th>
              <th th:text="#{diary.updatedTime}">更新時間</th>
              <th th:text="#{diary.title}">タイトル</th>
              <th th:text="#{diary.content}">本文</th>
              <th th:text="#{diary.actions}">操作</th>
            </tr>
          </thead>

          <tbody>
            <tr th:each="diary : ${diaries}">
              <td
                th:attr="data-label=#{diary.createdDate}"
                th:text="${#temporals.format(diary.createdAt, #locale.language == 'ja' ? 'yyyy年M月d日' : 'MMM d, yyyy')}"
              >
                2026年8月16日
              </td>

              <td
                th:attr="data-label=#{diary.updatedDate}"
                th:text="${#temporals.format(diary.updatedAt, #locale.language == 'ja' ? 'yyyy年M月d日' : 'MMM d, yyyy')}"
              >
                2026年8月16日
              </td>

              <td
                th:attr="data-label=#{diary.updatedTime}"
                th:text="${#temporals.format(
                  diary.updatedAt,
                  'HH:mm'
                )}"
              >
                20:57
              </td>

              <td
                th:attr="data-label=#{diary.title}"
                class="cell-title"
                th:text="${diary.title}"
              >
                今日の日記
              </td>

              <td
                th:attr="data-label=#{diary.content}"
                class="cell-content"
                th:text="${diary.content}"
              >
                今日も一日頑張りました。
              </td>

              <td th:attr="data-label=#{diary.actions}" class="action-cell">
                <div class="row-actions">
                  <button
                    type="button"
                    class="btn-edit"
                    th:attr="data-id=${diary.id}"
                    th:text="#{diary.edit}"
                  >
                    編集
                  </button>
                </div>
              </td>
            </tr>

            <!-- 日記が1件も存在しない場合に表示します。 -->
            <tr th:if="${#lists.isEmpty(diaries)}">
              <td
                colspan="6"
                class="empty-message"
                th:text="${invalidSearchDate}
                  ? #{diary.empty.invalidDate}
                  : (${searchActive} ? #{diary.empty.search} : #{diary.empty.all})"
              >
                まだ日記が投稿されていません。
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- ページ移動後も現在の並び順を維持します。 -->
      <nav
        class="pagination"
        th:if="${totalPages > 1}"
        th:attr="aria-label=#{diary.pagination}"
      >
        <a
          th:if="${currentPage > 0}"
          th:href="@{/(
            page=${currentPage - 1},
            sort=${sort},
            searchDate=${searchDate}
          )}"
          class="pagination-button"
          th:text="#{diary.previous}"
        >
          前へ
        </a>

        <span class="pagination-info">
          <span th:text="${currentPage + 1}">1</span>
          /
          <span th:text="${totalPages}">2</span>
        </span>

        <a
          th:if="${currentPage + 1 lt totalPages}"
          th:href="@{/(
            page=${currentPage + 1},
            sort=${sort},
            searchDate=${searchDate}
          )}"
          class="pagination-button"
          th:text="#{diary.next}"
        >
          次へ
        </a>
      </nav>
    </section>
    <div th:replace="~{fragments/footer :: footer}"></div>
  </main>

  <!-- 日記編集モーダル -->
  <div
    id="editModal"
    class="modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modalTitle"
    aria-hidden="true"
  >
    <div class="modal-content">
      <h2 id="modalTitle" th:text="#{diary.editHeading}">日記を編集</h2>

      <p
        id="editErrorMessage"
        class="error-message"
        role="alert"
      ></p>

      <form id="editForm">
        <input
          type="hidden"
          id="csrfToken"
          th:name="${_csrf.parameterName}"
          th:value="${_csrf.token}"
        >

        <div class="form-group">
          <label for="editTitle" th:text="#{diary.title}">タイトル</label>
          <input
            type="text"
            id="editTitle"
            name="title"
            maxlength="100"
            required
          >
        </div>

        <div class="form-group">
          <label for="editContent" th:text="#{diary.content}">本文</label>
          <textarea
            id="editContent"
            name="content"
            rows="10"
            maxlength="2000"
            required
          ></textarea>
        </div>

        <div class="modal-actions">
          <button type="submit" class="btn-primary" th:text="#{diary.update}">
            更新
          </button>

          <button
            type="button"
            id="editCancelButton"
            class="btn-secondary"
            th:text="#{diary.cancel}"
          >
            キャンセル
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- 登録・更新結果を表示する共通通知モーダル -->
  <div th:replace="~{fragments/notification :: notification}"></div>

  <div
    th:if="${successMessage}"
    id="diarySuccessMessage"
    th:text="${successMessage}"
    hidden
  ></div>

  <!-- JavaScriptから必要な文言だけを参照し、画面文字列の散在を防ぎます。 -->
  <div id="localizedMessages"
       hidden
       th:attr="data-write=#{diary.write},
                data-close-writer=#{diary.closeWriter},
                data-fetch-error=#{diary.error.fetch},
                data-fetch-unexpected=#{diary.error.fetchUnexpected},
                data-csrf-error=#{diary.error.csrf},
                data-update-unexpected=#{diary.error.updateUnexpected}"></div>

  <script th:src="@{/js/diary.js(v=20260901-2)}"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet">
    <title>マイページ - 日記アプリ</title>
    <link rel="stylesheet" th:href="@{/css/diary.css}">
</head>
<body>
    <header class="site-header">
        <h1 th:text="${username} + 'さんの ありがとう日記'">ユーザー名さんの日記</h1>
        <form th:action="@{/logout}" method="post" class="logout-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="btn-text">ログアウト</button>
        </form>
    </header>

    <main class="container">
        <section class="diary-write-section">
            <button type="button"
                    id="diaryFormToggle"
                    class="diary-form-toggle"
                    onclick="toggleDiaryForm()">
                <span id="diaryFormToggleText">日記を書く</span>
                <span id="diaryFormToggleIcon" class="toggle-icon">▼</span>
            </button>

            <div id="diaryWriteForm" class="diary-form-container">
                <form th:action="@{/diary}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                    <div class="form-group">
                        <label for="title">タイトル</label>
                        <input type="text"
                               id="title"
                               name="title"
                               th:value="${title}"
                               required>
                    </div>

                    <div class="form-group">
                        <label for="content">本文</label>
                        <textarea id="content"
                                  name="content"
                                  rows="10"
                                  th:text="${content}"
                                  required></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit">登録</button>
                    </div>
                </form>
            </div>

            <div th:if="${errorMessage}"
                 id="diaryErrorMessage"
                 th:text="${errorMessage}"
                 hidden>
            </div>
        </section>

        <section class="diary-list-section">
            <h2>日記一覧</h2>
            <div class="table-responsive">
                <table class="diary-table">
                    <thead>
                        <tr>
                            <th>作成日</th>
                            <th>更新日</th>
                            <th>更新時間</th>
                            <th>タイトル</th>
                            <th>本文</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="diary : ${diaries}">
                            <td data-label="作成日" th:text="${#temporals.format(diary.createdAt, 'yyyy年M月d日')}">2026年8月16日</td>
                            <td data-label="更新日" th:text="${#temporals.format(diary.updatedAt, 'yyyy年M月d日')}">2026年8月16日</td>
                            <td data-label="更新時間" th:text="${#temporals.format(diary.updatedAt, 'HH:mm')}">20:57</td>
                            <td data-label="タイトル" class="cell-title" th:text="${diary.title}">今日の日記</td>
                            <td data-label="本文" class="cell-content" th:text="${diary.content}">今日も一日頑張りました。</td>
                            <td data-label="操作">
                                <button type="button"
                                        class="btn-edit"
                                        th:attr="data-id=${diary.id}"
                                        onclick="openEditModal(this)">
                                    編集
                                </button>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(diaries)}">
                            <td colspan="6" class="empty-message">まだ日記が投稿されていません。</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <nav class="pagination"
                 th:if="${totalPages > 1}"
                 aria-label="日記一覧のページ切り替え">
                <a th:if="${currentPage > 0}"
                   th:href="@{/(page=${currentPage - 1})}"
                   class="pagination-button">
                    前へ
                </a>
                <span class="pagination-info">
                    <span th:text="${currentPage + 1}">1</span>
                    /
                    <span th:text="${totalPages}">2</span>
                </span>
                <a th:if="${currentPage + 1 < totalPages}"
                   th:href="@{/(page=${currentPage + 1})}"
                   class="pagination-button">
                    次へ
                </a>
            </nav>
        </section>
    </main>

    <div id="editModal"
         class="modal"
         role="dialog"
         aria-labelledby="modalTitle"
         aria-hidden="true">
        <div class="modal-content">
            <h2 id="modalTitle">日記を編集</h2>
            <p id="editErrorMessage" class="error-message" role="alert"></p>

            <form id="editForm">
                <input type="hidden"
                       id="csrfToken"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <div class="form-group">
                    <label for="editTitle">タイトル</label>
                    <input type="text" id="editTitle" name="title" required>
                </div>

                <div class="form-group">
                    <label for="editContent">本文</label>
                    <textarea id="editContent" name="content" rows="10" required></textarea>
                </div>

                <div class="modal-actions">
                    <button type="submit" class="btn-primary">更新</button>
                    <button type="button"
                            class="btn-secondary"
                            onclick="closeEditModal()">
                        キャンセル
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div th:replace="~{fragments/notification :: notification}"></div>

    <div th:if="${successMessage}"
         id="diarySuccessMessage"
         th:text="${successMessage}"
         hidden>
    </div>

    <script th:src="@{/js/diary.js}"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap"
    rel="stylesheet"
  >

  <title>マイページ - 日記アプリ</title>
  <link rel="stylesheet" th:href="@{/css/diary.css(v=20260827-3)}">
</head>

<body>
  <!-- ログイン中のユーザー名とログアウト操作を表示します。 -->
  <header class="site-header">
    <h1 th:text="${username} + 'さんの ありがとう日記'">
      ユーザー名さんの日記
    </h1>

    <form th:action="@{/logout}" method="post" class="logout-form">
      <input
        type="hidden"
        th:name="${_csrf.parameterName}"
        th:value="${_csrf.token}"
      >
      <button type="submit" class="btn-text">ログアウト</button>
    </form>
  </header>

  <main class="container">
    <!-- 日記の新規登録セクション -->
    <section class="diary-write-section">
      <button
        type="button"
        id="diaryFormToggle"
        class="diary-form-toggle"
        onclick="toggleDiaryForm()"
        aria-controls="diaryWriteForm"
        aria-expanded="false"
      >
        <span id="diaryFormToggleText">日記を書く</span>
        <span
          id="diaryFormToggleIcon"
          class="toggle-icon"
          aria-hidden="true"
        >
          ▼
        </span>
      </button>

      <div id="diaryWriteForm" class="diary-form-container">
        <form th:action="@{/diary}" method="post">
          <input
            type="hidden"
            th:name="${_csrf.parameterName}"
            th:value="${_csrf.token}"
          >

          <div class="form-group">
            <label for="title">タイトル</label>
            <input
              type="text"
              id="title"
              name="title"
              th:value="${title}"
              maxlength="100"
              required
            >
          </div>

          <div class="form-group">
            <label for="content">本文</label>
            <textarea
              id="content"
              name="content"
              rows="10"
              th:text="${content}"
              maxlength="2000"
              required
            ></textarea>
          </div>

          <div class="form-actions">
            <button type="submit">登録</button>
          </div>
        </form>
      </div>

      <!-- 登録エラーは通知モーダルから表示します。 -->
      <div
        th:if="${errorMessage}"
        id="diaryErrorMessage"
        th:text="${errorMessage}"
        hidden
      ></div>
    </section>

    <!-- 日記一覧セクション -->
    <section class="diary-list-section">
      <div class="diary-list-header">
        <h2>日記一覧</h2>

        <!-- 選択した並び順をGETリクエストでControllerへ送信します。 -->
        <form
          th:action="@{/(searchDate=${searchDate})}"
          method="get"
          class="sort-form"
        >
          <input
            type="hidden"
            name="searchDate"
            th:value="${searchDate}"
          >

          <label for="sort" class="sort-label">並べ替え</label>

          <select
            id="sort"
            name="sort"
            class="sort-select"
            onchange="this.form.submit()"
            aria-label="日記の並び順"
          >
            <option
              value="desc"
              th:selected="${sort == null or sort == 'desc'}"
            >
              新しい順
            </option>

            <option
              value="asc"
              th:selected="${sort == 'asc'}"
            >
              古い順
            </option>
          </select>
        </form>
      </div>

      <div class="diary-search-bar">
        <form th:action="@{/}" method="get" class="search-form">
          <input type="hidden" name="sort" th:value="${sort}" />

          <label for="searchDate" class="search-label">日付で検索</label>

          <div class="search-controls">
            <input
              type="date"
              id="searchDate"
              name="searchDate"
              class="search-input"
              th:value="${searchDate}"
              aria-label="日付で検索"
            >

            <button type="submit" class="btn-search">検索</button>

            <a
              th:if="${searchDate != null and !#strings.isEmpty(searchDate)}"
              th:href="@{/(sort=${sort})}"
              class="btn-reset"
            >
              クリア
            </a>
          </div>
        </form>
      </div>

      <!-- 日記一覧テーブル -->
      <div class="table-responsive">
        <table class="diary-table">
          <thead>
            <tr>
              <th>作成日</th>
              <th>更新日</th>
              <th>更新時間</th>
              <th>タイトル</th>
              <th>本文</th>
              <th>操作</th>
            </tr>
          </thead>

          <tbody>
            <tr th:each="diary : ${diaries}">
              <td
                data-label="作成日"
                th:text="${#temporals.format(
                  diary.createdAt,
                  'yyyy年M月d日'
                )}"
              >
                2026年8月16日
              </td>

              <td
                data-label="更新日"
                th:text="${#temporals.format(
                  diary.updatedAt,
                  'yyyy年M月d日'
                )}"
              >
                2026年8月16日
              </td>

              <td
                data-label="更新時間"
                th:text="${#temporals.format(
                  diary.updatedAt,
                  'HH:mm'
                )}"
              >
                20:57
              </td>

              <td
                data-label="タイトル"
                class="cell-title"
                th:text="${diary.title}"
              >
                今日の日記
              </td>

              <td
                data-label="本文"
                class="cell-content"
                th:text="${diary.content}"
              >
                今日も一日頑張りました。
              </td>

              <td data-label="操作" class="action-cell">
                <div class="row-actions">
                  <button type="button" class="btn-edit" th:attr="data-id=${diary.id}" onclick="openEditModal(this)">編集</button>
                  <button type="button" class="btn-delete" th:attr="data-id=${diary.id},data-title=${diary.title}" onclick="openDeleteModal(this)">削除</button>
                </div>
              </td>
            </tr>

            <!-- 日記が1件も存在しない場合に表示します。 -->
            <tr th:if="${#lists.isEmpty(diaries)}">
              <td
                colspan="6"
                class="empty-message"
                th:text="${invalidSearchDate}
                  ? '日付の形式が正しくありません。日付を選び直してください。'
                  : (${searchActive} ? '指定した日付の日記は見つかりませんでした。' : 'まだ日記が投稿されていません。')"
              >
                まだ日記が投稿されていません。
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- ページ移動後も現在の並び順を維持します。 -->
      <nav
        class="pagination"
        th:if="${totalPages > 1}"
        aria-label="日記一覧のページ切り替え"
      >
        <a
          th:if="${currentPage > 0}"
          th:href="@{/(
            page=${currentPage - 1},
            sort=${sort},
            searchDate=${searchDate}
          )}"
          class="pagination-button"
        >
          前へ
        </a>

        <span class="pagination-info">
          <span th:text="${currentPage + 1}">1</span>
          /
          <span th:text="${totalPages}">2</span>
        </span>

        <a
          th:if="${currentPage + 1 lt totalPages}"
          th:href="@{/(
            page=${currentPage + 1},
            sort=${sort},
            searchDate=${searchDate}
          )}"
          class="pagination-button"
        >
          次へ
        </a>
      </nav>
    </section>
  </main>

  <!-- 日記編集モーダル -->
  <div
    id="editModal"
    class="modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modalTitle"
    aria-hidden="true"
  >
    <div class="modal-content">
      <h2 id="modalTitle">日記を編集</h2>

      <p
        id="editErrorMessage"
        class="error-message"
        role="alert"
      ></p>

      <form id="editForm">
        <input
          type="hidden"
          id="csrfToken"
          th:name="${_csrf.parameterName}"
          th:value="${_csrf.token}"
        >

        <div class="form-group">
          <label for="editTitle">タイトル</label>
          <input
            type="text"
            id="editTitle"
            name="title"
            maxlength="100"
            required
          >
        </div>

        <div class="form-group">
          <label for="editContent">本文</label>
          <textarea
            id="editContent"
            name="content"
            rows="10"
            maxlength="2000"
            required
          ></textarea>
        </div>

        <div class="modal-actions">
          <button type="submit" class="btn-primary">
            更新
          </button>

          <button
            type="button"
            class="btn-secondary"
            onclick="closeEditModal()"
          >
            キャンセル
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- 誤操作を防ぐ削除確認モーダル -->
  <div id="deleteModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="deleteModalTitle" aria-hidden="true">
    <div class="modal-content modal-content-small">
      <div class="danger-icon" aria-hidden="true">!</div>
      <h2 id="deleteModalTitle">日記を削除しますか？</h2>
      <p><strong id="deleteDiaryTitle"></strong> は削除後に元へ戻せません。</p>
      <div class="modal-actions">
        <button type="button" id="confirmDeleteButton" class="btn-danger">削除する</button>
        <button type="button" class="btn-secondary" onclick="closeDeleteModal()">キャンセル</button>
      </div>
    </div>
  </div>

  <!-- 登録・更新結果を表示する共通通知モーダル -->
  <div th:replace="~{fragments/notification :: notification}"></div>

  <div
    th:if="${successMessage}"
    id="diarySuccessMessage"
    th:text="${successMessage}"
    hidden
  ></div>

  <script th:src="@{/js/diary.js}"></script>
</body>
</html>

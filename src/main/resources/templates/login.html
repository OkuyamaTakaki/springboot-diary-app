<!DOCTYPE html>
<html lang="ja" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title th:text="#{login.pageTitle}">ログイン - 奥山貴希のありがとう日記</title>
  <link rel="stylesheet" th:href="@{/css/diary.css(v=20260901-4)}">
</head>
<body class="login-page">
  <main class="container">
    <div th:replace="~{fragments/language :: switcher}"></div>
    <div class="app-title">
      <div class="app-title-main" th:text="#{app.name}">奥山貴希のありがとう日記</div>
      <div class="app-title-sub" th:text="#{app.tagline}">感謝を記録する日記アプリ</div>
    </div>
    <aside class="startup-notice" aria-labelledby="startupNoticeTitle">
      <strong id="startupNoticeTitle" th:text="#{startup.notice.title}">
        初回表示に時間がかかる場合があります
      </strong>
      <span th:text="#{startup.notice.message}">
        無料環境の休止後は、起動まで少し時間がかかる場合があります。
      </span>
    </aside>
    <h1 th:text="#{login.heading}">ログイン</h1>
    <form th:action="@{/login}" method="post">
      <!-- CSRFトークンを同送し、外部サイトからの不正ログイン送信を防止する。 -->
      <input type="hidden"
             th:name="${_csrf.parameterName}"
             th:value="${_csrf.token}">
      <div class="form-group">
        <label for="username" th:text="#{common.username}">ユーザー名</label>
        <input type="text"
               id="username"
               name="username"
               required
               autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password" th:text="#{common.password}">パスワード</label>
        <input type="password"
               id="password"
               name="password"
               required
               autocomplete="current-password">
      </div>
      <div id="loginErrorMessage"
           th:if="${param.error != null}"
           th:text="#{login.invalid}"
           hidden>
        ユーザー名またはパスワードが正しくありません。
      </div>
      <button type="submit" th:text="#{login.submit}">ログイン</button>
    </form>
    <div class="form-footer">
      <a th:href="@{/register}" class="link-secondary" th:text="#{login.registerLink}">新規登録はこちら</a>
    </div>
    <div th:replace="~{fragments/footer :: footer}"></div>
  </main>
  <div th:replace="~{fragments/notification :: notification}"></div>
  <!-- 登録完了メッセージを共通通知モーダルへ渡す。 -->
  <div id="registerSuccessMessage"
       th:if="${successMessage}"
       th:text="${successMessage}"
       hidden></div>
  <script th:src="@{/js/diary.js(v=20260901-1)}"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン - ありがとう日記</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/diary.css(v=20260827-6)}">
</head>
<body class="login-page">
  <main class="container">
    <div class="app-title">
      <div class="app-title-main">ありがとう日記</div>
      <div class="app-title-sub">感謝を記録する日記アプリ</div>
    </div>
    <h1>ログイン</h1>
    <form th:action="@{/login}" method="post">
      <!-- CSRFトークンを同送し、外部サイトからの不正ログイン送信を防止する。 -->
      <input type="hidden"
             th:name="${_csrf.parameterName}"
             th:value="${_csrf.token}">
      <div class="form-group">
        <label for="username">ユーザー名</label>
        <input type="text"
               id="username"
               name="username"
               required
               autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">パスワード</label>
        <input type="password"
               id="password"
               name="password"
               required
               autocomplete="current-password">
      </div>
      <div id="loginErrorMessage"
           th:if="${param.error != null}"
           hidden>
        ユーザー名またはパスワードが正しくありません。
      </div>
      <button type="submit">ログイン</button>
    </form>
    <div class="form-footer">
      <a th:href="@{/register}" class="link-secondary">新規登録はこちら</a>
    </div>
  </main>
  <div th:replace="~{fragments/notification :: notification}"></div>
  <!-- 登録完了メッセージを共通通知モーダルへ渡す。 -->
  <div id="registerSuccessMessage"
       th:if="${successMessage}"
       th:text="${successMessage}"
       hidden></div>
  <script th:src="@{/js/diary.js}"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title th:text="#{privacy.pageTitle}">プライバシー情報 - 奥山貴希のありがとう日記</title>
  <link rel="stylesheet" th:href="@{/css/diary.css(v=20260901-4)}">
</head>
<body class="privacy-page">
  <main class="privacy-container">
    <div th:replace="~{fragments/language :: switcher}"></div>
    <header class="policy-header">
      <p class="policy-app-name" th:text="#{app.name}">奥山貴希のありがとう日記</p>
      <h1 th:text="#{privacy.heading}">プライバシー情報</h1>
      <p th:text="#{privacy.summary}">
        この画面は、サービスが扱う情報と保護方法を説明します。
      </p>
    </header>

    <section class="policy-notice"
             th:unless="${privacyContactConfigured}"
             role="status">
      <h2 th:text="#{privacy.status.title}">公開前の確認が必要です</h2>
      <p th:text="#{privacy.status.message}">
        問い合わせ先が未設定のため、この状態では本番公開できません。
      </p>
    </section>

    <div class="policy-sections">
      <section class="policy-section">
        <h2 th:text="#{privacy.data.heading}">扱う情報</h2>
        <p th:text="#{privacy.data.body}"></p>
      </section>
      <section class="policy-section">
        <h2 th:text="#{privacy.purpose.heading}">利用目的</h2>
        <p th:text="#{privacy.purpose.body}"></p>
      </section>
      <section class="policy-section">
        <h2 th:text="#{privacy.storage.heading}">保存先と外部事業者</h2>
        <p th:text="#{privacy.storage.body}"></p>
      </section>
      <section class="policy-section">
        <h2 th:text="#{privacy.cookies.heading}">Cookie</h2>
        <p th:text="#{privacy.cookies.body}"></p>
      </section>
      <section class="policy-section">
        <h2 th:text="#{privacy.sharing.heading}">第三者提供・広告・解析</h2>
        <p th:text="#{privacy.sharing.body}"></p>
      </section>
      <section class="policy-section">
        <h2 th:text="#{privacy.retention.heading}">保存期間と削除</h2>
        <p th:text="#{privacy.retention.body}"></p>
      </section>
      <section class="policy-section">
        <h2 th:text="#{privacy.rights.heading}">確認・訂正などの依頼</h2>
        <p th:text="#{privacy.rights.body}"></p>
      </section>
      <section class="policy-section">
        <h2 th:text="#{privacy.security.heading}">安全管理</h2>
        <p th:text="#{privacy.security.body}"></p>
      </section>
      <section class="policy-section">
        <h2 th:text="#{privacy.contact.heading}">お問い合わせ</h2>
        <p th:if="${privacyContactConfigured}">
          <a th:href="${privacyContactUrl}"
             rel="noopener noreferrer"
             th:text="#{privacy.contact.link}">プライバシーに関する問い合わせ先</a>
        </p>
        <p th:if="${privacyContactConfigured}"
           th:text="#{privacy.contact.notice}">
          仮窓口には秘密情報や個人情報を送らないでください。
        </p>
        <p th:unless="${privacyContactConfigured}"
           th:text="#{privacy.contact.missing}"></p>
      </section>
    </div>

    <p class="policy-updated" th:text="#{privacy.updateDate}">更新日: 2026年9月2日</p>
    <nav class="policy-actions" th:attr="aria-label=#{privacy.navigation}">
      <a class="btn-secondary" th:href="@{/login}" th:text="#{common.backToLogin}">
        ログイン画面へ戻る
      </a>
    </nav>
    <div th:replace="~{fragments/footer :: footer}"></div>
  </main>
</body>
</html>
